# Induction Layer Conformance Expectations
# Version: 0.1.0
# Depends on: Advisory Layer (Level 1 minimum)
# Each scenario defines a sequence of operations and expected outcomes.
# A conforming implementation MUST pass all scenarios.

groups:
  # ─────────────────────────────────────────────
  # Saturation Detection and Manifest Generation
  # ─────────────────────────────────────────────

  induction:
    description: Saturation-triggered manifest proposal generation
    scenarios:
      - id: single_actor_cannot_trigger_induction
        description: Signals from one actor never trigger induction regardless of count
        steps:
          - action: configure_saturation
            input:
              zone_glob: "test/induction"
              threshold_deposits: 3
              threshold_lineages: 2
              window_seconds: 3600

          - action: deposit
            input:
              id: "sig-050"
              zone: "test/induction"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000000
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-051"
              zone: "test/induction"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000010
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-052"
              zone: "test/induction"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000020
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/induction"
            expect:
              count: 0

      - id: multi_actor_convergence_triggers_induction
        description: When threshold deposits from threshold lineages accumulate, a proposal is generated
        steps:
          - action: configure_saturation
            input:
              zone_glob: "test/induction2"
              threshold_deposits: 3
              threshold_lineages: 2
              window_seconds: 3600

          - action: deposit
            input:
              id: "sig-053"
              zone: "test/induction2"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000000
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-054"
              zone: "test/induction2"
              kind: "quality_concern"
              actor_id: "agent-beta"
              created_at_unix: 1716000010
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-055"
              zone: "test/induction2"
              kind: "quality_concern"
              actor_id: "agent-gamma"
              created_at_unix: 1716000020
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/induction2"
            expect:
              count: 1
              proposals:
                - state: "pending"
                  zone: "test/induction2"
                  actor_count_gte: 2

      - id: proposal_is_mortal
        description: Generated proposals have expiry and are cleaned after TTL
        steps:
          - action: list_proposals
            input:
              zone: "test/induction2"
            expect:
              count: 1
              proposals:
                - has_expires_at_unix: true

      - id: proposal_requires_explicit_acceptance
        description: Proposals do not auto-promote — explicit accept is required
        steps:
          - action: list_proposals
            input:
              zone: "test/induction2"
            expect:
              proposals:
                - state: "pending"

          - action: accept_proposal
            input:
              manifest_id: "${proposals[0].manifest_id}"
              actor_id: "operator-1"
            expect:
              result: accepted
              new_state: "accepted"

      - id: proposal_dismissal
        description: Proposals can be explicitly dismissed
        steps:
          - action: configure_saturation
            input:
              zone_glob: "test/dismiss"
              threshold_deposits: 2
              threshold_lineages: 2
              window_seconds: 3600

          - action: deposit
            input:
              id: "sig-060"
              zone: "test/dismiss"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000000
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-061"
              zone: "test/dismiss"
              kind: "quality_concern"
              actor_id: "agent-beta"
              created_at_unix: 1716000010
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/dismiss"
            expect:
              count: 1

          - action: dismiss_proposal
            input:
              manifest_id: "${proposals[0].manifest_id}"
              actor_id: "operator-1"
              reason: "False positive — unrelated signals"
            expect:
              result: accepted
              new_state: "dismissed"

      - id: expired_signals_do_not_count
        description: Signals past their TTL do not contribute to saturation
        steps:
          - action: configure_saturation
            input:
              zone_glob: "test/expiry"
              threshold_deposits: 2
              threshold_lineages: 2
              window_seconds: 3600

          - action: deposit
            input:
              id: "sig-070"
              zone: "test/expiry"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000000
              expires_at_unix: 1716000060
            expect:
              result: accepted

          - action: advance_time
            input:
              to_unix: 1716000120

          - action: deposit
            input:
              id: "sig-071"
              zone: "test/expiry"
              kind: "quality_concern"
              actor_id: "agent-beta"
              created_at_unix: 1716000120
              expires_at_unix: 1716003720
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/expiry"
            expect:
              count: 0

      - id: kind_filter_respected
        description: Only signals matching kind_filter count toward saturation
        steps:
          - action: configure_saturation
            input:
              zone_glob: "test/kindfilter"
              threshold_deposits: 2
              threshold_lineages: 2
              window_seconds: 3600
              kind_filter: "security_concern"

          - action: deposit
            input:
              id: "sig-080"
              zone: "test/kindfilter"
              kind: "quality_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000000
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-081"
              zone: "test/kindfilter"
              kind: "quality_concern"
              actor_id: "agent-beta"
              created_at_unix: 1716000010
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/kindfilter"
            expect:
              count: 0

          - action: deposit
            input:
              id: "sig-082"
              zone: "test/kindfilter"
              kind: "security_concern"
              actor_id: "agent-alpha"
              created_at_unix: 1716000020
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: deposit
            input:
              id: "sig-083"
              zone: "test/kindfilter"
              kind: "security_concern"
              actor_id: "agent-beta"
              created_at_unix: 1716000030
              expires_at_unix: 1716003600
            expect:
              result: accepted

          - action: list_proposals
            input:
              zone: "test/kindfilter"
            expect:
              count: 1
